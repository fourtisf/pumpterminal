<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- subtle scan lines -->
  <g stroke="#00ff88" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="120" x2="1500" y2="120"/>
    <line x1="0" y1="240" x2="1500" y2="240"/>
    <line x1="0" y1="360" x2="1500" y2="360"/>
    <line x1="0" y1="480" x2="1500" y2="480"/>
  </g>

  <!-- top bar -->
  <g font-family="ui-monospace, monospace" font-size="14" fill="#4a525c" letter-spacing="0.3em">
    <text x="60" y="50">PUMPRADAR · v0.1 · MAINNET BETA</text>
    <text x="1440" y="50" text-anchor="end">@PUMPRADARSOLANA</text>
  </g>
  <line x1="60" y1="70" x2="1440" y2="70" stroke="#1f2429" stroke-width="1"/>

  <!-- logo mark, big -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="120" height="120" rx="22" fill="rgba(0,255,136,0.10)" stroke="#00ff88" stroke-width="3"/>
    <path d="M 60 18 A 42 42 0 0 1 102 60" stroke="#00ff88" stroke-width="3.5" stroke-opacity="0.4" stroke-linecap="round" fill="none"/>
    <path d="M 60 34 A 26 26 0 0 1 86 60" stroke="#00ff88" stroke-width="3.5" stroke-opacity="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="60" r="9" fill="#00ff88" filter="url(#glow1)"/>
  </g>

  <!-- hero -->
  <g transform="translate(220, 165)" fill="#e8eaed">
    <text font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.35em" fill="#4a525c">
      LIVE PUMPFUN INTELLIGENCE TERMINAL
    </text>
    <text y="80" font-family="system-ui, sans-serif" font-size="78" font-weight="700" letter-spacing="-0.02em">
      Hunt the next <tspan fill="#00ff88">100x</tspan>
    </text>
    <text y="138" font-family="system-ui, sans-serif" font-size="34" font-weight="500" letter-spacing="-0.01em" fill="#8a929c">
      before anyone else.
    </text>
  </g>

  <!-- feature chips -->
  <g transform="translate(220, 360)" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.2em">
    <g>
      <rect x="0" y="0" width="180" height="42" rx="6" fill="rgba(0,255,136,0.08)" stroke="rgba(0,255,136,0.4)"/>
      <circle cx="20" cy="21" r="4" fill="#00ff88"/>
      <text x="36" y="27" fill="#00ff88">LIVE FEED</text>
    </g>
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="220" height="42" rx="6" fill="rgba(255,107,203,0.08)" stroke="rgba(255,107,203,0.4)"/>
      <text x="18" y="27" fill="#ff6bcb">NARRATIVE HEAT</text>
    </g>
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="220" height="42" rx="6" fill="rgba(255,181,71,0.08)" stroke="rgba(255,181,71,0.4)"/>
      <text x="18" y="27" fill="#ffb547">GRAD ALERTS</text>
    </g>
    <g transform="translate(680, 0)">
      <rect x="0" y="0" width="200" height="42" rx="6" fill="rgba(184,124,255,0.08)" stroke="rgba(184,124,255,0.4)"/>
      <text x="18" y="27" fill="#b87cff">WALLET ROAST</text>
    </g>
  </g>

  <!-- right side: boot log -->
  <g transform="translate(1080, 130)" font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.04em">
    <text fill="#8a929c">[ <tspan fill="#00ff88">  ok  </tspan> ] pumpfun firehose</text>
    <text y="28" fill="#8a929c">[ <tspan fill="#00ff88">  ok  </tspan> ] narrative classifier</text>
    <text y="56" fill="#8a929c">[ <tspan fill="#00ff88">  ok  </tspan> ] bonding curve tracker</text>
    <text y="84" fill="#8a929c">[ <tspan fill="#00ff88">  ok  </tspan> ] wallet roaster 🔥</text>
    <text y="112" fill="#8a929c">[ <tspan fill="#00ff88"> live </tspan> ] watching every launch</text>
    <text y="140" fill="#8a929c">[ <tspan fill="#ffb547">ready </tspan> ] ▶ <tspan fill="#00ff88">/live</tspan></text>
  </g>

  <!-- bottom domain bar -->
  <line x1="60" y1="450" x2="1440" y2="450" stroke="#1f2429"/>
  <g font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.3em">
    <text x="60" y="480" fill="#4a525c">SOLANA · PUMPFUN · REAL-TIME</text>
    <text x="1440" y="480" text-anchor="end" fill="#00ff88" font-weight="700">PUMPRADAR.CLICK</text>
  </g>
</svg>

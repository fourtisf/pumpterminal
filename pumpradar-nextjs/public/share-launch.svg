<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="-10%" r="80%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid2" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <linearGradient id="proGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb547"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect width="1200" height="675" fill="url(#grid2)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- corner brackets — degen terminal vibe -->
  <g stroke="#00ff88" stroke-width="2" fill="none" stroke-opacity="0.6">
    <path d="M 40 40 L 40 80 M 40 40 L 80 40"/>
    <path d="M 1160 40 L 1160 80 M 1160 40 L 1120 40"/>
    <path d="M 40 635 L 40 595 M 40 635 L 80 635"/>
    <path d="M 1160 635 L 1160 595 M 1160 635 L 1120 635"/>
  </g>

  <!-- top: logo + handle -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="56" height="56" rx="11" fill="rgba(0,255,136,0.10)" stroke="#00ff88" stroke-width="2"/>
    <path d="M 28 8 A 20 20 0 0 1 48 28" stroke="#00ff88" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" fill="none"/>
    <path d="M 28 16 A 12 12 0 0 1 40 28" stroke="#00ff88" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="28" r="4.2" fill="#00ff88" filter="url(#glow3)"/>
    <text x="74" y="26" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em" fill="#e8eaed">PUMPRADAR</text>
    <text x="74" y="48" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.3em" fill="#4a525c">@PUMPRADARSOLANA · MAINNET</text>
  </g>

  <!-- hero text -->
  <g transform="translate(60, 220)" fill="#e8eaed">
    <text font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.35em" fill="#4a525c">
      pump.fun intelligence terminal — live
    </text>
    <text y="84" font-family="system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-0.025em">
      Hunt the next <tspan fill="#00ff88">100x</tspan>
    </text>
    <text y="158" font-family="system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-0.025em">
      before <tspan fill="#00ff88">anyone else.</tspan>
    </text>
  </g>

  <!-- chips row -->
  <g transform="translate(60, 460)" font-family="ui-monospace, monospace" font-size="14" letter-spacing="0.2em">
    <g>
      <rect width="170" height="48" rx="7" fill="rgba(0,255,136,0.10)" stroke="rgba(0,255,136,0.45)"/>
      <circle cx="22" cy="24" r="4.5" fill="#00ff88" filter="url(#glow3)"/>
      <text x="40" y="31" fill="#00ff88">LIVE FEED</text>
    </g>
    <g transform="translate(186, 0)">
      <rect width="230" height="48" rx="7" fill="rgba(255,107,203,0.10)" stroke="rgba(255,107,203,0.45)"/>
      <text x="20" y="31" fill="#ff6bcb">NARRATIVE HEAT</text>
    </g>
    <g transform="translate(432, 0)">
      <rect width="220" height="48" rx="7" fill="rgba(255,181,71,0.10)" stroke="rgba(255,181,71,0.45)"/>
      <text x="20" y="31" fill="#ffb547">GRAD ALERTS</text>
    </g>
    <g transform="translate(668, 0)">
      <rect width="220" height="48" rx="7" fill="rgba(184,124,255,0.10)" stroke="rgba(184,124,255,0.45)"/>
      <text x="20" y="31" fill="#b87cff">WALLET ROAST</text>
    </g>
  </g>

  <!-- terminal block bottom -->
  <g transform="translate(60, 540)">
    <rect width="1080" height="90" rx="10" fill="#111316" stroke="#1f2429"/>
    <g transform="translate(20, 18)">
      <circle cx="0" cy="0" r="5" fill="#ff3d5a" fill-opacity="0.6"/>
      <circle cx="14" cy="0" r="5" fill="#ffb547" fill-opacity="0.6"/>
      <circle cx="28" cy="0" r="5" fill="#00ff88" fill-opacity="0.6"/>
      <text x="48" y="4" font-family="ui-monospace, monospace" font-size="11" fill="#4a525c" letter-spacing="0.2em">pumpradar — live</text>
    </g>
    <g transform="translate(20, 50)" font-family="ui-monospace, monospace" font-size="14" fill="#8a929c">
      <text>[ <tspan fill="#00ff88">live</tspan>  ] watching every launch · narrative heat · graduation alerts · wallet roast </text>
      <text y="22">[ <tspan fill="#ffb547">ready</tspan> ] ▶ <tspan fill="#00ff88">pumpradar.click</tspan></text>
    </g>
  </g>

  <!-- pumpradar.click bottom right -->
  <text x="60" y="660" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.3em" fill="#4a525c">
    SOLANA · PUMPFUN · REAL-TIME
  </text>
  <text x="1140" y="660" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" letter-spacing="0.3em" fill="url(#proGrad)" font-weight="700">
    PUMPRADAR.CLICK
  </text>
</svg>

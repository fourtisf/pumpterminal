<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d2218"/>
      <stop offset="55%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc6a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- solid dark gradient bg -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- subtle grid texture -->
  <g stroke="#00ff88" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- depth: faint concentric guide rings -->
  <circle cx="200" cy="200" r="155" fill="none" stroke="rgba(0,255,136,0.08)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="105" fill="none" stroke="rgba(0,255,136,0.12)" stroke-width="1.5"/>

  <!-- BRIGHT green radar sweep arcs (top-right, BOLD) -->
  <path d="M 200 50 A 150 150 0 0 1 350 200"
        stroke="url(#ring)" stroke-width="18"
        stroke-opacity="0.55"
        stroke-linecap="round" fill="none"
        filter="url(#glow)"/>
  <path d="M 200 105 A 95 95 0 0 1 295 200"
        stroke="url(#ring)" stroke-width="18"
        stroke-linecap="round" fill="none"
        filter="url(#glow)"/>

  <!-- glowing target dot at center -->
  <circle cx="200" cy="200" r="50" fill="#00ff88" opacity="0.18" filter="url(#dotGlow)"/>
  <circle cx="200" cy="200" r="22" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="14" fill="#ccffe5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc6a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- solid green bg fills entire square -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- depth: faint concentric rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(10,11,13,0.08)" stroke-width="2"/>
  <circle cx="200" cy="200" r="115" fill="none" stroke="rgba(10,11,13,0.10)" stroke-width="2"/>

  <!-- radar sweep arcs (top-right, black) -->
  <path d="M 200 60 A 140 140 0 0 1 340 200"
        stroke="#0a0b0d" stroke-width="16" stroke-linecap="round"
        fill="none" opacity="0.42"/>
  <path d="M 200 110 A 90 90 0 0 1 290 200"
        stroke="#0a0b0d" stroke-width="16" stroke-linecap="round"
        fill="none" opacity="0.82"/>

  <!-- dual-tone target dot -->
  <circle cx="200" cy="200" r="34" fill="#0a0b0d" filter="url(#softShadow)"/>
  <circle cx="200" cy="200" r="14" fill="#00ff88"/>
</svg>

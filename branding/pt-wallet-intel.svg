  <rect x="1402" y="148" width="52" height="24" fill="none" stroke="#00ff66" stroke-opacity="0.4"/>
  <text x="1414" y="165" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#00ff66" letter-spacing="2">LIVE</text>


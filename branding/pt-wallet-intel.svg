<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="rim" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c24e"/><stop offset="55%" stop-color="#00ff66"/><stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="body" x1="16" y1="12" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/><stop offset="45%" stop-color="#00ff66"/><stop offset="100%" stop-color="#00c24e"/>
    </linearGradient>
    <linearGradient id="pinkAv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6bcb"/><stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.16"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.09"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 H 0 V 46" fill="none" stroke="#00ff66" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="60%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1600" height="900" fill="url(#fadeY)"/></mask>
    <g id="mark">
      <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8" fill="#071009"/>
      <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8" fill="url(#glow)"/>
      <g clip-path="url(#sq)"><ellipse cx="11" cy="3.4" rx="12" ry="3.2" fill="#ffffff" opacity="0.06"/></g>
      <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8" stroke="url(#rim)" stroke-width="1.3" fill="none"/>
      <path d="M 16 6.2 V 25.4" stroke="#00ff66" stroke-opacity="0.55" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="12.6" y="12.4" width="6.8" height="10" rx="2" fill="url(#body)"/>
      <circle cx="16" cy="6.2" r="1.7" fill="#00ff66"/>
      <circle cx="16" cy="6.2" r="0.8" fill="#eafff2"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#050a07"/>

  <text x="944" y="248" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="20" fill="#1a0510">BQ</text>
  <text x="996" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="24" fill="#d8f0dd">BQVz7f…6kPRmB</text>

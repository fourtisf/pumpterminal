<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="rim" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c24e"/><stop offset="55%" stop-color="#00ff66"/><stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="body" x1="16" y1="12" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/><stop offset="45%" stop-color="#00ff66"/><stop offset="100%" stop-color="#00c24e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.16"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageGlow" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.09"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>

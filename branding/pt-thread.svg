<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="rim" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00c24e"/><stop offset="55%" stop-color="#00ff66"/><stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="body" x1="16" y1="12" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/><stop offset="45%" stop-color="#00ff66"/><stop offset="100%" stop-color="#00c24e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.16"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pageGlow" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.10"/><stop offset="100%" stop-color="#00ff66" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8"/></clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 H 0 V 46" fill="none" stroke="#00ff66" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1600" height="900" fill="url(#fadeY)"/></mask>
    <g id="mark">
      <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8" fill="#071009"/>
      <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8" fill="url(#glow)"/>
      <g clip-path="url(#sq)"><ellipse cx="11" cy="3.4" rx="12" ry="3.2" fill="#ffffff" opacity="0.06"/></g>
      <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8.8" stroke="url(#rim)" stroke-width="1.3" fill="none"/>
      <path d="M 6.4 21.6 H 9.8" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 22.2 10.4 H 25.6" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 16 6.2 V 25.4" stroke="#00ff66" stroke-opacity="0.55" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="12.6" y="12.4" width="6.8" height="10" rx="2" fill="#00ff66" opacity="0.45" filter="url(#soft)"/>
      <rect x="12.6" y="12.4" width="6.8" height="10" rx="2" fill="url(#body)"/>
      <rect x="13.5" y="13.3" width="2.2" height="3.4" rx="1.1" fill="#ffffff" opacity="0.35"/>
      <circle cx="16" cy="6.2" r="3" fill="#00ff66" opacity="0.35" filter="url(#soft)"/>
      <circle cx="16" cy="6.2" r="1.7" fill="#00ff66"/>
      <circle cx="16" cy="6.2" r="0.8" fill="#eafff2"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#050a07"/>
  <rect width="1600" height="900" fill="url(#pageGlow)"/>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- HUD corners -->
  <path d="M 30 48 V 30 H 48" stroke="#00ff66" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 1552 30 H 1570 V 48" stroke="#00ff66" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 30 782 V 800 H 48" stroke="#00ff66" stroke-opacity="0.4" stroke-width="2" fill="none"/>
  <path d="M 1570 782 V 800 H 1552" stroke="#00ff66" stroke-opacity="0.4" stroke-width="2" fill="none"/>

  <!-- ascending candle silhouette -->
  <g opacity="0.8">
    <g stroke="#00ff66" stroke-opacity="0.10" stroke-width="3">
      <line x1="170" y1="600" x2="170" y2="780"/><line x1="290" y1="630" x2="290" y2="790"/>
      <line x1="410" y1="580" x2="410" y2="760"/><line x1="530" y1="600" x2="530" y2="770"/>
      <line x1="650" y1="550" x2="650" y2="740"/><line x1="770" y1="560" x2="770" y2="750"/>
      <line x1="890" y1="520" x2="890" y2="710"/><line x1="1010" y1="530" x2="1010" y2="700"/>
      <line x1="1130" y1="480" x2="1130" y2="670"/><line x1="1250" y1="450" x2="1250" y2="640"/>
    </g>
    <g fill="#00ff66" fill-opacity="0.10">
      <rect x="152" y="650" width="36" height="100" rx="6"/><rect x="272" y="680" width="36" height="84" rx="6"/>
      <rect x="392" y="625" width="36" height="105" rx="6"/><rect x="512" y="645" width="36" height="95" rx="6"/>
      <rect x="632" y="595" width="36" height="115" rx="6"/><rect x="752" y="610" width="36" height="105" rx="6"/>
      <rect x="872" y="565" width="36" height="115" rx="6"/><rect x="992" y="580" width="36" height="90" rx="6"/>
      <rect x="1112" y="525" width="36" height="115" rx="6"/><rect x="1232" y="495" width="36" height="115" rx="6"/>
    </g>
    <!-- breakout candle -->
    <line x1="1370" y1="380" x2="1370" y2="620" stroke="#00ff66" stroke-opacity="0.4" stroke-width="3.5"/>
    <rect x="1348" y="430" width="44" height="130" rx="7" fill="#00ff66" opacity="0.28" filter="url(#soft2)"/>
    <rect x="1348" y="430" width="44" height="130" rx="7" fill="url(#body)" opacity="0.55"/>
    <circle cx="1370" cy="380" r="9" fill="#00ff66" opacity="0.3" filter="url(#soft2)"/>
    <circle cx="1370" cy="380" r="5" fill="#00ff66" opacity="0.85"/>
    <circle cx="1370" cy="380" r="2.2" fill="#eafff2"/>
  </g>

  <!-- lockup -->
  <g transform="translate(759,108) scale(2.6)"><use href="#mark"/></g>
  <text x="800" y="262" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="21" letter-spacing="9" fill="#79917f">INTRODUCING — <tspan fill="#00ff66">PUMPTERMINAL</tspan></text>

  <text x="800" y="392" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="106" fill="#d8f0dd" letter-spacing="-4">Hunt the next <tspan fill="#00ff66">100x</tspan></text>
  <text x="800" y="508" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="106" fill="#d8f0dd" letter-spacing="-4">before anyone else.</text>

  <text x="800" y="580" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#79917f" letter-spacing="1">Every pump.fun launch, streamed live — narratives · bonding curves · graduations · roasts</text>

  <!-- bottom status bar -->
  <rect x="0" y="836" width="1600" height="64" fill="#070f0a"/>
  <rect x="0" y="836" width="1600" height="2" fill="#16271c"/>
  <rect x="0" y="836" width="150" height="64" fill="#00ff66"/>
  <text x="34" y="876" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="20" fill="#02160a" letter-spacing="3">▮ LIVE</text>
  <text x="186" y="876" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#79917f" letter-spacing="3">MAINNET·SOLANA</text>
  <text x="1566" y="876" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#00ff66" letter-spacing="3">pumpterminal.click</text>
</svg>

# pumpterminal — nginx vhost (template; deploy.sh substitutes __DOMAIN__)
#
#   /    -> Next.js frontend            (127.0.0.1:3000)
#   /ws  -> live-feed worker WebSocket  (127.0.0.1:4000)
#
# certbot --nginx adds the 443/SSL server block + HTTP->HTTPS redirect,
# so this file only defines port 80.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 10m;

    # Browser WebSocket for the live feed (NEXT_PUBLIC_WS_URL=wss://__DOMAIN__/ws)
    location /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
